name: Update commit feed

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest commits by me
        env:
          GH_TOKEN: ${{ secrets.GH_COMMIT_FEED_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p api

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/search/commits?q=author:aceyash-dev&sort=author-date&order=desc&per_page=100" \
            --jq '.items[] | {
              repo: .repository.name,
              repoUrl: .repository.html_url,
              message: (.commit.message | split("\n")[0]),
              date: (.commit.author.date // .commit.committer.date),
              url: .html_url,
              public: (.repository.private | not)
            }' |
            jq -s 'unique_by(.url) | sort_by(.date) | reverse | .[0:3]' > api/commits.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- api/commits.json; then
            echo "Commit feed unchanged."
            exit 0
          fi

          git add api/commits.json
          git commit -m "Update latest commit feed"
          git push
