name: Update recent commits

on:
  push:
    branches: [main]
    paths-ignore:
      - data/recent-commits.json
      - .github/workflows/recent-commits.yml
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-recent-commits:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
    steps:
      - name: Generate recent commits
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output
          login="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user" | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>{const u=JSON.parse(s); if(!u.login) process.exit(1); process.stdout.write(u.login);})")

          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/commits?q=author:${login}&sort=committer-date&order=desc&per_page=3" \
            -o response.json

          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('response.json', 'utf8'));

          if (!Array.isArray(response.items)) {
            throw new Error('GitHub did not return commit search results');
          }

          const commits = response.items.slice(0, 3).map(item => {
            const repo = item.repository || {};
            const visibility = repo.visibility || (repo.private ? 'private' : 'public');
            return {
              repo: repo.name || repo.full_name || 'repository',
              repoUrl: repo.html_url || null,
              public: visibility === 'public',
              message: String(item.commit?.message || item.commit?.title || '').split('\n')[0],
              date: item.commit?.author?.date || item.commit?.committer?.date || null,
              url: item.html_url || null
            };
          });

          fs.writeFileSync(
            'output/recent-commits.json',
            JSON.stringify(commits, null, 2) + '\n'
          );
          NODE

      - name: Publish recent commits
        shell: bash
        run: |
          set -euo pipefail

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GITHUB_PAT}@github.com/aceyash-dev/aceyash-dev.github.io.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          mkdir -p data
          cp output/recent-commits.json data/recent-commits.json

          if git diff --quiet -- data/recent-commits.json; then
            echo "No recent-commit changes."
            exit 0
          fi

          git add data/recent-commits.json
          git commit -m "Update recent commits feed"
          git push origin main
