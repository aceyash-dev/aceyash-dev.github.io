<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Today's date in your local timezone."><title>Calendar Widget</title><link rel="stylesheet" href="./widget.css"></head>
<body><section class="widget widget--calendar"><h1 class="widget__title">Today</h1><p class="widget__value" id="calendar"></p><p class="widget__meta" id="calendar-year"></p></section>
<script>const today=new Date();document.querySelector('#calendar').textContent=today.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});document.querySelector('#calendar-year').textContent=today.toLocaleDateString('en-IN',{year:'numeric'});</script></body></html>
