<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Widget</title>
    <style>
        .clock {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            color: #333;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock">Loading...</div>
    
    <script>
        function updateClock() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            document.getElementById('clock').textContent = now.toLocaleDateString('en-IN', options);
        }
        
        // Update every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
