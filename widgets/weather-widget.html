<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <style>
        .weather-widget {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            color: #333;
            padding: 15px;
            background: #e8f4fd;
            border-radius: 8px;
            border: 1px solid #b3e5fc;
            width: 220px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="weather-widget" id="weather">Loading weather...</div>
    
    <script>
        // Simple weather widget placeholder
        // In a real implementation, this would fetch weather data from an API
        const weatherData = {
            location: "Udhampur, JK",
            temperature: "28°C",
            condition: "Sunny",
            humidity: "45%",
            wind: "5 km/h"
        };
        
        document.getElementById('weather').innerHTML = \`
            <div><strong>📍</strong> \${weatherData.location}</div>
            <div>\${weatherData.temperature} \${weatherData.condition}</div>
            <div>💧 \${weatherData.humidity}</div>
            <div>💨 \${weatherData.wind}</div>
        \`;
    </script>
</body>
</html>
